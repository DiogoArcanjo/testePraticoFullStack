services:
  db:
    image: postgres:17
    container_name: usuarios-db
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: usuarios
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d usuarios"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data: